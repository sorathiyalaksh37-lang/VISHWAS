<!DOCTYPE html>
<html>
<head>
    <title>Microphone Diagnostic</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1e293b; color: #e2e8f0; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 8px; }
        button:hover { background: #2563eb; }
        #visualizer { border: 2px solid #475569; border-radius: 8px; background: #0f172a; }
        .info { background: #1e40af; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .error { background: #991b1b; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .success { background: #065f46; padding: 15px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🎤 Microphone Diagnostic Tool</h1>
    <p>This page tests if your microphone is working in the browser.</p>
    
    <button id="testBtn" onclick="testMicrophone()">Start Microphone Test</button>
    <button id="stopBtn" onclick="stopTest()" disabled style="background: #dc2626;">Stop Test</button>
    
    <div id="status"></div>
    
    <h3>Audio Level:</h3>
    <canvas id="visualizer" width="800" height="200"></canvas>
    
    <div id="devices"></div>

    <script>
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let javascriptNode = null;
        let animationId = null;
        let stream = null;

        async function testMicrophone() {
            try {
                document.getElementById('status').innerHTML = '<div class="info">Requesting microphone access...</div>';
                
                // List available devices first
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                
                let deviceHtml = '<div class="info"><strong>Available Microphones:</strong><ul>';
                audioInputs.forEach((device, i) => {
                    deviceHtml += `<li>${i + 1}. ${device.label || 'Microphone ' + (i + 1)} (${device.deviceId.substring(0, 20)}...)</li>`;
                });
                deviceHtml += '</ul></div>';
                document.getElementById('devices').innerHTML = deviceHtml;
                
                // Request microphone - use default device
                stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                
                document.getElementById('status').innerHTML = '<div class="success">✓ Microphone access granted!</div>';
                
                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Resume if suspended
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                document.getElementById('status').innerHTML += `<div class="info">AudioContext: ${audioContext.state}, Sample Rate: ${audioContext.sampleRate}Hz</div>`;
                
                // Create analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                // Create microphone input
                microphone = audioContext.createMediaStreamSource(stream);
                
                // Connect microphone to analyser
                microphone.connect(analyser);
                
                // Create script processor to read data
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);
                
                let sampleCount = 0;
                javascriptNode.onaudioprocess = function() {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteTimeDomainData(array);
                    
                    // Calculate average amplitude
                    let sum = 0;
                    for (let i = 0; i < array.length; i++) {
                        const normalized = (array[i] - 128) / 128;
                        sum += Math.abs(normalized);
                    }
                    const avg = sum / array.length;
                    
                    sampleCount++;
                    if (sampleCount % 10 === 0) { // Log every 10 samples
                        if (avg < 0.001) {
                            document.getElementById('status').innerHTML = '<div class="error">⚠ WARNING: Microphone is detecting SILENCE<br>Average level: ' + (avg * 100).toFixed(4) + '%<br><br>Troubleshooting:<br>1. Check Windows Sound Settings → Make sure correct microphone is selected<br>2. Speak LOUDLY into microphone<br>3. Check microphone is not muted<br>4. Try a different microphone</div>';
                        } else {
                            document.getElementById('status').innerHTML = '<div class="success">✓ AUDIO DETECTED!<br>Average level: ' + (avg * 100).toFixed(2) + '%<br>Keep speaking...</div>';
                        }
                    }
                };
                
                // Visualize
                visualize();
                
                document.getElementById('testBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                
            } catch (error) {
                document.getElementById('status').innerHTML = '<div class="error">✗ Error: ' + error.message + '<br><br>Make sure:<br>1. You clicked "Allow" for microphone permission<br>2. Your microphone is connected<br>3. Using Chrome or Edge browser</div>';
            }
        }

        function visualize() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteTimeDomainData(array);
                
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#3b82f6';
                ctx.beginPath();
                
                const sliceWidth = width / array.length;
                let x = 0;
                
                for (let i = 0; i < array.length; i++) {
                    const v = array[i] / 128.0;
                    const y = v * height / 2;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                ctx.stroke();
            }
            
            draw();
        }

        function stopTest() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            if (javascriptNode) {
                javascriptNode.disconnect();
                javascriptNode = null;
            }
            if (analyser) {
                analyser.disconnect();
                analyser = null;
            }
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            document.getElementById('status').innerHTML = '<div class="info">Test stopped.</div>';
            document.getElementById('testBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
